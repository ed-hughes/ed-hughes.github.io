<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager Lookup</title>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<style>
  :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; padding: 14px; color: #2c3345; background: #fff; }
  .card { border: 1px solid #dfe4ec; border-radius: 8px; padding: 14px 16px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; margin-bottom: 8px; }
  .name { font-size: 16px; font-weight: 600; }
  .mail { font-size: 14px; color: #4b5563; margin-top: 2px; }
  .muted { color: #6b7280; font-size: 14px; }
  .err { color: #b42318; font-size: 13px; }
  select { width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 14px;
           border: 1px solid #cbd2dd; border-radius: 6px; }
  .row { margin-bottom: 12px; }
  .hint { font-size: 11px; color: #9099a8; margin-top: 8px; }
</style>
</head>
<body>

<div class="card">
  <div class="row">
    <div class="label">Signed in as</div>
    <select id="who"></select>
  </div>

  <div class="label">Your manager (live from Active Directory)</div>
  <div id="result"><span class="muted">Loading…</span></div>
  <div class="hint" id="hint"></div>
</div>

<script>
(function () {
  var ENDPOINT = "https://jotformdemofn97d2eb.azurewebsites.net/api/directory" +
    "?code=gj9uAhgJ8TPiZvrVrjcd64cmooIVd0WUv8__PphnXOKgAzFuG865Og==";

  // The Jotform script loads on a plain page too, so its presence alone doesn't
  // mean we're in a form — a widget always runs inside Jotform's iframe.
  var inJotform = typeof JFCustomWidget !== "undefined" && window.self !== window.top;

  var $who = document.getElementById("who");
  var $result = document.getElementById("result");
  var $hint = document.getElementById("hint");
  var rows = [];
  var current = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function resize() {
    if (inJotform) JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight + 20 });
  }

  function show(person) {
    current = person;
    if (!person || !person.manager) {
      $result.innerHTML = '<span class="muted">No manager on file' +
        (person ? " for " + esc(person.name) : "") + ".</span>";
      if (inJotform) JFCustomWidget.sendData({ value: "" });
      return resize();
    }
    $result.innerHTML =
      '<div class="name">' + esc(person.manager) + "</div>" +
      '<div class="mail">' + esc(person.managerEmail) + "</div>";
    if (inJotform) JFCustomWidget.sendData({ value: person.managerEmail });
    resize();
  }

  function load() {
    fetch(ENDPOINT)
      .then(function (r) {
        if (!r.ok) throw new Error("API returned " + r.status);
        return r.json();
      })
      .then(function (data) {
        rows = data || [];
        rows.forEach(function (r) {
          var o = document.createElement("option");
          o.value = r.email;
          o.textContent = r.name;
          $who.appendChild(o);
        });
        // Open on someone who has a manager so the demo lands well.
        var first = rows.filter(function (r) { return r.manager; })[0] || rows[0];
        if (first) { $who.value = first.email; show(first); }
        $hint.textContent = rows.length + " people loaded live from the directory";
        resize();
      })
      .catch(function (e) {
        $result.innerHTML = '<span class="err">Could not load the directory (' + esc(e.message) + ").</span>";
        resize();
      });
  }

  $who.addEventListener("change", function () {
    var hit = rows.filter(function (r) { return r.email === $who.value; })[0];
    show(hit || null);
  });

  if (inJotform) {
    JFCustomWidget.subscribe("ready", function () { load(); });
    JFCustomWidget.subscribe("submit", function () {
      // Advisory only — never block submission on a directory lookup.
      JFCustomWidget.sendSubmit({
        valid: true,
        value: current && current.manager ? current.managerEmail : "",
      });
    });
  } else {
    load();
  }
})();
</script>
</body>
</html>
