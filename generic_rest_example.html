<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jotfor.ms/s/umd/latest/for-custom-widgets.js"></script>
</head>
<body style="margin:0;font-family:Arial,sans-serif;">
  <!-- Live preview of exactly what gets sent as metadata -->
  <div id="preview"></div>
  <script>
    // Same card, but styled with a <style> block + classes instead of inline styles.
    // Teal/green palette so it's obvious at a glance which version rendered.
    const HTML = `
      <style>
        .jfdemo-card { font-family:Arial,sans-serif; font-size:13px; max-width:400px; border:1px solid #99f6e4; border-radius:6px; }
        .jfdemo-head { background:#0d9488; color:#fff; padding:8px 12px; font-weight:bold; }
        .jfdemo-table { border-collapse:collapse; width:100%; }
        .jfdemo-table td { padding:6px 12px; }
        .jfdemo-table tr.jfdemo-alt { background:#f0fdfa; }
        .jfdemo-label { color:#4b5563; font-weight:bold; }
      </style>
      <div class="jfdemo-card">
        <div class="jfdemo-head">Demo Card (style block)</div>
        <table class="jfdemo-table">
          <tr class="jfdemo-alt">
            <td class="jfdemo-label">ID</td>
            <td>12345</td>
          </tr>
          <tr>
            <td class="jfdemo-label">Name</td>
            <td>Example Retailer</td>
          </tr>
        </table>
      </div>`;
    function toBase64(str) {
      return btoa(str);
    }
    function getData() {
      const b64 = toBase64(HTML);
      return {
        valid: true,
        value: JFCustomWidgetUtils.buildMetadata("htmltext", b64)
      };
    }
    JFCustomWidget.subscribe("ready", () => {
      document.getElementById("preview").innerHTML = HTML;
      JFCustomWidget.requestFrameResize({ height: document.body.scrollHeight + 10 });
      JFCustomWidget.sendData(getData());
      JFCustomWidget.subscribe("submit", () => {
        JFCustomWidget.sendSubmit(getData());
      });
    });
  </script>
</body>
</html>
